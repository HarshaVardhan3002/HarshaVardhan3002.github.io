name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild every 6 hours so the Hugging Face numbers and model list stay current.
  schedule:
    - cron: "40 */6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Save the new numbers to the repo once a day. The commit also keeps the
      # schedule alive: GitHub turns off schedules in repos with 60 days of no activity.
      - name: Save the Hugging Face numbers
        if: github.event_name == 'schedule'
        run: |
          today=$(date -u +%F)
          if ! git show HEAD:src/hf.ts | grep -q "\"synced\": \"$today\""; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/hf.ts
            git diff --cached --quiet || { git commit -m "Hugging Face numbers for $today" && { git push || echo "push skipped, the site still deploys"; }; }
          fi
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
